            - generic [ref=e182]: Kabarett
            - generic [ref=e183]:
              - paragraph [ref=e184]: Komm her, du Gieriger!
              - text: In Person noch ehrlicher, tiefer, wesentlich verschwitzter, angeblich witziger und je nach Sitzplatz auch ein bissl größer. Absolutes Kulterprogramm, da kannst auch die Mami und die Großödan mitnehmen. Schau dich mal um. Komm mach jetzt, trau dich.
              - paragraph [ref=e185]: Mit großvärterlicher Liebe, Dr.Bohl
            - generic [ref=e186]:
              - generic [ref=e187]:
                - generic [ref=e188]:
                  - generic [ref=e190]:
                    - generic [ref=e191]: Solo
                    - button [ref=e192] [cursor=pointer]: Alle Termine
                  - button [ref=e193] [cursor=pointer]
                - generic [ref=e196]:
                  - paragraph [ref=e197]: Jeder war’s mal, viele sind es. Viele wollen’s, wenige lang. Mickie besingt es und Han heißt so. SOLO.
                  - paragraph [ref=e198]: "Erstmals hat es auch Paulus erwischt: Nach zwei bahnbrechenden Programmen mit seinem kongenialen Bruder muss er diesmal allein ran. Er nutzt dies, um für alle Suchenden da draußen aufzuarbeiten, wovon er viele hatte: Dates. Das häufigst anvisierte Minenfeld dieser Welt. Anhand von fünf überlebten Tinder Dates werden Fehler, Red Flags und vor allem die eigene Vergangenheit aufgearbeitet. Von Opernball mit DJ Ötzi bis Maturareise-Exzess, all die Storys, die im Zuge dieser Treffen erzählt wurden, landen nun gesammelt auf der Bühne."
                  - paragraph [ref=e199]: Ob das eine gute Idee ist?
              - generic [ref=e200]:
                - generic [ref=e201]:
                  - generic [ref=e203]: Anabohlika
                  - button [ref=e205] [cursor=pointer]
                - generic [ref=e208]:
                  - paragraph [ref=e209]: "Prostata-Untersuchungen bereiten Ihnen Sorgen? Drachen machen Ihnen Angst? Sie fürchten sich vor langen Autofahrten mit Ihrem Partner? Dann empfehlen wir: ANABOHLIKA."
                  - paragraph [ref=e210]: Wir müssen Sie allerdings enttäuschen, Sie werden damit leider nicht so wunderschön werden wie Arnold „The Oak“ Schwarzenegger. Aber das wird ja eh keiner. Außer vielleicht Hansi Ernst Hinterseer. Aber das ist ein anderes Thema.
                  - paragraph [ref=e211]: Nach dem großen Erfolg des ersten Programmes „Dr.Bohl – Live!“ folgt nun der zweite Streich des süßen, aber auch sexy Bruderpaars. Winkeln Sie die Beine an, entspannen Sie sich und denken Sie an etwas Schönes!
              - generic [ref=e212]:
                - generic [ref=e213]:
                  - generic [ref=e215]:
                    - generic [ref=e216]: Dr.Bohl– Live!
                    - button [ref=e217] [cursor=pointer]: Stream Now
                  - button [ref=e218] [cursor=pointer]
                - generic [ref=e221]:
                  - paragraph [ref=e222]: Sie verstehen Piraten auch nicht? Ja wissen wir, blöde Frage eigentlich, natürlich verstehen Sie die nicht. Sind ja auch wirklich komische Typen, diese Piraten.
                  - paragraph [ref=e223]: Bis jetzt wirkt alles noch normal. Schon wieder zwei so Hawara, die Piraten nicht verstehen, was soll’s?
                  - paragraph [ref=e224]: Doch wir sind nicht wie alle anderen. Wir sind Macher! Und wir lassen uns nicht länger von der Piratenlobby auf den Schädel scheißen!
                  - paragraph [ref=e225]: "Wir haben die Antworten, die Sie schon immer wollten! Also kommen Sie vorbei, damit diese unzähligen schlaflosen Nächte verdammt nochmal endlich ein Ende finden: Weil Sie jetzt wissen, dass Sie mit all Ihren Fragen nicht länger alleine sind."
            - generic [ref=e226]:
              - paragraph [ref=e227]: Keine neuen Projekte verpassen.
              - generic [ref=e228]:
