        - article [ref=f1e186]:
          - generic [ref=f1e187]:
            - generic [ref=f1e188]: Kabarett
            - generic [ref=f1e189]:
              - paragraph [ref=f1e190]: Komm her, du Gieriger!
              - text: In Person noch ehrlicher, tiefer, wesentlich verschwitzter, angeblich witziger und je nach Sitzplatz auch ein bissl größer. Absolutes Kulterprogramm, da kannst auch die Mami und die Großödan mitnehmen. Schau dich mal um. Komm mach jetzt, trau dich.
              - paragraph [ref=f1e191]: Mit großvärterlicher Liebe, Dr.Bohl
            - generic [ref=f1e192]:
              - generic [ref=f1e193]:
                - generic [ref=f1e194]:
                  - generic [ref=f1e196]:
                    - generic [ref=f1e197]: Solo
                    - button [ref=f1e198] [cursor=pointer]: Alle Termine
                  - button [ref=f1e199] [cursor=pointer]
                - generic [ref=f1e202]:
                  - paragraph [ref=f1e203]: Jeder war’s mal, viele sind es. Viele wollen’s, wenige lang. Mickie besingt es und Han heißt so. SOLO.
                  - paragraph [ref=f1e204]: "Erstmals hat es auch Paulus erwischt: Nach zwei bahnbrechenden Programmen mit seinem kongenialen Bruder muss er diesmal allein ran. Er nutzt dies, um für alle Suchenden da draußen aufzuarbeiten, wovon er viele hatte: Dates. Das häufigst anvisierte Minenfeld dieser Welt. Anhand von fünf überlebten Tinder Dates werden Fehler, Red Flags und vor allem die eigene Vergangenheit aufgearbeitet. Von Opernball mit DJ Ötzi bis Maturareise-Exzess, all die Storys, die im Zuge dieser Treffen erzählt wurden, landen nun gesammelt auf der Bühne."
                  - paragraph [ref=f1e205]: Ob das eine gute Idee ist?
              - generic [ref=f1e206]:
                - generic [ref=f1e207]:
                  - generic [ref=f1e209]: Anabohlika
                  - button [ref=f1e211] [cursor=pointer]
                - generic [ref=f1e214]:
                  - paragraph [ref=f1e215]: "Prostata-Untersuchungen bereiten Ihnen Sorgen? Drachen machen Ihnen Angst? Sie fürchten sich vor langen Autofahrten mit Ihrem Partner? Dann empfehlen wir: ANABOHLIKA."
                  - paragraph [ref=f1e216]: Wir müssen Sie allerdings enttäuschen, Sie werden damit leider nicht so wunderschön werden wie Arnold „The Oak“ Schwarzenegger. Aber das wird ja eh keiner. Außer vielleicht Hansi Ernst Hinterseer. Aber das ist ein anderes Thema.
                  - paragraph [ref=f1e217]: Nach dem großen Erfolg des ersten Programmes „Dr.Bohl – Live!“ folgt nun der zweite Streich des süßen, aber auch sexy Bruderpaars. Winkeln Sie die Beine an, entspannen Sie sich und denken Sie an etwas Schönes!
              - generic [ref=f1e218]:
                - generic [ref=f1e219]:
                  - generic [ref=f1e221]:
                    - generic [ref=f1e222]: Dr.Bohl– Live!
                    - button [ref=f1e223] [cursor=pointer]: Stream Now
                  - button [ref=f1e224] [cursor=pointer]
                - generic [ref=f1e227]:
                  - paragraph [ref=f1e228]: Sie verstehen Piraten auch nicht? Ja wissen wir, blöde Frage eigentlich, natürlich verstehen Sie die nicht. Sind ja auch wirklich komische Typen, diese Piraten.
                  - paragraph [ref=f1e229]: Bis jetzt wirkt alles noch normal. Schon wieder zwei so Hawara, die Piraten nicht verstehen, was soll’s?
                  - paragraph [ref=f1e230]: Doch wir sind nicht wie alle anderen. Wir sind Macher! Und wir lassen uns nicht länger von der Piratenlobby auf den Schädel scheißen!
                  - paragraph [ref=f1e231]: "Wir haben die Antworten, die Sie schon immer wollten! Also kommen Sie vorbei, damit diese unzähligen schlaflosen Nächte verdammt nochmal endlich ein Ende finden: Weil Sie jetzt wissen, dass Sie mit all Ihren Fragen nicht länger alleine sind."
            - generic [ref=f1e232]:
              - paragraph [ref=f1e233]: Keine neuen Projekte verpassen.
              - generic [ref=f1e234]:
